# SPDX-License-Identifier: AGPL-3.0-or-later
# CuNi release matrix: on tag push v*, or workflow_dispatch of an
# existing tag, build the four release binaries, package each as
# cuni-{version}-{target}.tar.gz (binary at archive root — this must
# match [package.metadata.binstall] pkg-url/bin-dir/pkg-fmt in
# Cargo.toml), checksum, and attach everything to the GitHub release.
#
# workflow_dispatch checks out the given tag and publishes to that
# tag. It does not move or recreate the tag. Use this when the
# workflow file has changed after the tag was pushed.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach a GitHub release for (e.g. v0.10.2). The tag is not moved."
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macos-15 is arm64; the Intel target needs the Intel image.
          # macos-14 was retired on 2026-11-02.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: tag matches Cargo.toml version
        run: |
          tag="${RELEASE_TAG#v}"
          pkg=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match Cargo.toml version $pkg" >&2
            exit 1
          fi
          echo "Building cuni $tag from $(git rev-parse HEAD)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: package tarball + checksum
        run: |
          version="${RELEASE_TAG#v}"
          target="${{ matrix.target }}"
          name="cuni-${version}-${target}"
          mkdir -p "pkg/${name}"
          cp "target/${target}/release/cuni" "pkg/${name}/cuni"
          tar czf "${name}.tar.gz" -C "pkg/${name}" cuni
          shasum -a 256 "${name}.tar.gz" > "SHA256SUMS-${target}.txt"
          cat "SHA256SUMS-${target}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            cuni-*.tar.gz
            SHA256SUMS-*.txt

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: merge checksums
        run: cat SHA256SUMS-*.txt > CHECKSUMS.txt && cat CHECKSUMS.txt

      # tag_name is the existing tag. target_commitish is omitted on
      # purpose: GitHub ignores it when the tag already exists, and we
      # must not create or move v* tags from a later workflow commit.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            cuni-*.tar.gz
            CHECKSUMS.txt
          generate_release_notes: true
